<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    #auri-avatar-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #auri-avatar-overlay {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(248, 250, 252, 0.86);
      color: rgba(29, 35, 42, 0.88);
      font-size: 12px;
      line-height: 1.35;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      opacity: 0;
      transition: opacity 160ms ease;
      pointer-events: none;
    }

    #auri-avatar-overlay[data-visible="true"] {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="auri-avatar-canvas"></canvas>
    <div id="auri-avatar-overlay" data-visible="true">Loading avatar…</div>
  </div>
  <script>
    window.AuriAvatarBootstrap = {
      modelURL: new URL("auri-avatar.vrm", window.location.href).href
    };
  </script>
  <script src="auri-avatar-viewer.js"></script>
</body>
</html>
